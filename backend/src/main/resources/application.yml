server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 1h
      cookie:
        name: OPTIFIT_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: strict
spring:
  application:
    name: optifit
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:optifit;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 11MB
  security:
    user:
      password: unused-login-disabled
management:
  endpoints:
    web:
      exposure:
        include: health
optifit:
  mode: ${OPTIFIT_MODE:demo}
  gemini-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
  search-key: ${TAVILY_API_KEY:}
  allowed-merchants: ${ALLOWED_MERCHANTS:www.atasunoptik.com.tr,www.istanbuloptik.com.tr,www.alkimoptik.com.tr}
  session-limit: ${SESSION_HOURLY_LIMIT:5}
  ip-limit: ${IP_HOURLY_LIMIT:20}
  daily-limit: ${DAILY_ANALYSIS_LIMIT:100}
  ttl-seconds: 3600
  timeout-seconds: 60
logging:
  level:
    org.springframework.ai: WARN
    com.google.genai: WARN
