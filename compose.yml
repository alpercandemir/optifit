services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPTIFIT_MODE: ${OPTIFIT_MODE:-demo}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ALLOWED_MERCHANTS: ${ALLOWED_MERCHANTS:-www.atasunoptik.com.tr,www.istanbuloptik.com.tr,www.alkimoptik.com.tr}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_HOURLY_LIMIT: ${SESSION_HOURLY_LIMIT:-5}
      IP_HOURLY_LIMIT: ${IP_HOURLY_LIMIT:-20}
      DAILY_ANALYSIS_LIMIT: ${DAILY_ANALYSIS_LIMIT:-100}
    mem_limit: 768m
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,mode=1777
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - backend
    restart: unless-stopped
