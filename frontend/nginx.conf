limit_req_zone $binary_remote_addr zone=uploads:10m rate=6r/m;
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data: https://www.atasunoptik.com.tr https://stn-atasun.mncdn.com https://www.istanbuloptik.com.tr https://www.alkimoptik.com.tr; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/v1/recommendations {
        limit_req zone=uploads burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_request_buffering off;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /assets/ { expires 1y; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
